name: 주말나들이 빌드 (비공개 저장소 코드 사용)

# 코드·서명 키·비밀번호는 비공개 저장소 tlsgusdlf33/A9 에만 있다. 이 파일에는 비밀 값을 적지 않는다.
# Secrets: A9_TOKEN (fine-grained PAT, tlsgusdlf33/A9 만, Contents 읽기/쓰기)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: A9 브랜치
        default: ccr-ca77bf7b-i91fk6

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tlsgusdlf33/A9
          ref: ${{ inputs.ref }}
          token: ${{ secrets.A9_TOKEN }}
          path: app
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Signing and keys (from private repo files, masked)
        working-directory: app/android
        run: |
          . signing/signing.env; echo "::add-mask::$UPLOAD_PASS"
          printf 'storeFile=signing/upload.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$UPLOAD_PASS" "$UPLOAD_PASS" > keystore.properties
          [ -f signing/secrets.properties ] && cp signing/secrets.properties secrets.properties || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Google Maven Central mirror (Maven Central often answers 429)
        run: |
          mkdir -p ~/.gradle/init.d
          printf '%s\n' 'settingsEvaluated { s -> def m = "https://maven-central.storage-download.googleapis.com/maven2/"; s.pluginManagement.repositories.maven { url m }; s.dependencyResolutionManagement.repositories.maven { url m } }' > ~/.gradle/init.d/jn-mirror.gradle

      - name: Test and build
        working-directory: app
        run: |
          node --test android/test/*.cjs
          (cd android && ./gradlew assembleDebug bundleRelease --no-daemon -q)
          VC=$(grep -m1 -oE 'versionCode [0-9]+' android/app/build.gradle | cut -d' ' -f2)
          VN=$(grep -m1 -oE 'versionName "[^"]+"' android/app/build.gradle | cut -d'"' -f2)
          echo "VC=$VC" >> "$GITHUB_ENV"; echo "VN=$VN" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/debug/app-debug.apk ../jumalnadeuli-$VN-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ../jumalnadeuli-$VN-release.aab
          rm -f android/keystore.properties android/secrets.properties

      - name: Check that the AAB uses the upload key
        run: |
          EXPECTED=$(. app/android/signing/signing.env; keytool -list -keystore app/android/signing/upload.jks -storepass "$UPLOAD_PASS" | grep -i 'SHA-256' | sed 's/.*: //')
          ACTUAL=$(keytool -printcert -jarfile jumalnadeuli-$VN-release.aab | grep 'SHA256' | head -1 | sed 's/.*SHA256: //')
          test "$EXPECTED" = "$ACTUAL"

      - name: Publish to private repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jn-${{ env.VC }}-${{ github.run_number }}
          name: "주말나들이 ${{ env.VN }} (versionCode ${{ env.VC }})"
          repository: tlsgusdlf33/A9
          token: ${{ secrets.A9_TOKEN }}
          files: |
            jumalnadeuli-${{ env.VN }}-debug.apk
            jumalnadeuli-${{ env.VN }}-release.aab

      - name: Delete older releases of this app (jn-* only)
        env:
          GH_TOKEN: ${{ secrets.A9_TOKEN }}
        run: |
          gh api repos/tlsgusdlf33/A9/releases --paginate -q '.[].tag_name' | grep '^jn-' | grep -vx "jn-${{ env.VC }}-${{ github.run_number }}" \
            | while read -r t; do gh release delete "$t" -R tlsgusdlf33/A9 --yes --cleanup-tag; done

      - name: Public repo safety check
        uses: actions/checkout@v4
        with:
          path: pubcheck
          persist-credentials: false
      - name: Scan public repo
        working-directory: pubcheck
        run: |
          bad=0
          f=$(git ls-files | grep -E -i '\.(keystore|jks|p12|pem|key)$|signing\.env$|secrets\.properties$|keystore\.properties$|^android/|jumalnadeuli-.*\.(apk|aab)$' || true)
          if [ -n "$f" ]; then echo "::error::보안/앱 코드 파일 발견:"; echo "$f"; bad=1; fi
          c=$(git grep -l -I -E 'storePassword=|keyPassword=|UPLOAD_PASS=|github_pat_|ghp_[A-Za-z0-9]{20}|BEGIN (RSA |EC )?PRIVATE KEY|NadeuliPlanner|NadeuliNative' -- . ':!.github/workflows/jumalnadeuli-build.yml' || true)
          if [ -n "$c" ]; then echo "::error::비밀 값/앱 코드 의심 내용 발견:"; echo "$c"; bad=1; fi
          [ $bad -eq 0 ] && echo "공개 저장소 검사 통과"
          exit $bad

      # 공개 빌드 기록: 이 워크플로의 이전 실행 기록을 지운다 (지금 실행 기록은 다음 빌드 때 지워짐)
      - name: Delete older public run logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/jumalnadeuli-build.yml/runs" -q '.workflow_runs[].id' \
            | grep -vx "${{ github.run_id }}" | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null || true; done
