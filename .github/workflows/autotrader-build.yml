# autotrader 앱 빌드 — 내용은 비공개 저장소에 있고, 여기서는 부르기만 한다.
#
# ⚠️ 왜 여기서 도는가
#    tlsgusdlf33/autotrader 는 비공개라 Actions 분(分)에 한도가 있고 실제로
#    다 썼다(2026-11-18, 빌드 잡이 단계 하나 못 돌고 2초 만에 죽었다).
#    공개 저장소의 Actions 는 무료·무제한이라 **돌리는 일만** 옮겼다.
#
# ⚠️ 여기에는 소스도 결과물도 두지 않는다
#    소스는 비공개 저장소에서 받아오고(AUTOTRADER_TOKEN), 만든 APK·AAB 도 비공개
#    저장소의 릴리스로 올라간다. 이 저장소에 남는 것은 이 파일 하나뿐이다.
#    **이 저장소의 다른 앱·문서 파일은 건드리지 않는다.**
#
# ⚠️ 바깥 사람이 돌릴 수 없게 한다
#    pull_request 로는 돌지 않는다. 손으로 돌리기와 정해진 시각만. 공개
#    저장소라도 Secrets 는 밖에서 보이지 않지만, 바깥 PR 이 워크플로를
#    돌리게 두면 새어나갈 길이 생긴다.
name: autotrader 빌드

on:
  workflow_dispatch:
  schedule:
    # 한국시간 평일 새벽 6시 10분. 하루 한 번.
    - cron: '10 21 * * 0-4'

permissions:
  contents: read

jobs:
  build:
    uses: tlsgusdlf33/autotrader/.github/workflows/main.yml@main
    secrets: inherit
